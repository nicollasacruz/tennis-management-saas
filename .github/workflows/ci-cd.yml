name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Verificação
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar cliente Prisma
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes API
        run: npm --workspace apps/api run test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy produção
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions: {}
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Deploy com health check e rollback
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: false
          script: |
            set -e
            if [ -z "${DEPLOY_PATH:-}" ]; then
              echo "DEPLOY_PATH não configurado."
              exit 1
            fi

            cd "$DEPLOY_PATH"

            HEALTH_CHECK='fetch("http://127.0.0.1/api/health").then((res) => { if (res.status !== 200) process.exit(1); }).catch(() => process.exit(1));'
            MAX_RETRIES=12
            RETRY_INTERVAL=5

            echo "📌 Revisão atual: $(git rev-parse --short HEAD)"
            PREV_REV="$(git rev-parse HEAD)"

            echo "⬇️  A atualizar código..."
            git fetch --all --prune
            git checkout main
            git pull --ff-only origin main

            echo "🐳 A reconstruir containers..."
            docker compose up -d --build

            echo "🏥 A verificar saúde da aplicação..."
            for i in $(seq 1 $MAX_RETRIES); do
              if docker compose exec -T web node -e "$HEALTH_CHECK"; then
                echo "✅ Aplicação saudável"
                exit 0
              fi
              echo "⏳ Tentativa $i/$MAX_RETRIES — a aguardar ${RETRY_INTERVAL}s..."
              sleep $RETRY_INTERVAL
            done

            echo "❌ Health check falhou após $((MAX_RETRIES * RETRY_INTERVAL))s. A fazer rollback para $PREV_REV..."
            git checkout "$PREV_REV"
            docker compose up -d --build

            echo "🔁 Rollback concluído. Aplicação restaurada para revisão $(git rev-parse --short HEAD)."
            exit 1
