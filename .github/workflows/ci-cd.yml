name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Verificação
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar cliente Prisma
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    name: Deploy produção
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions: {}
    steps:
      - name: Deploy com health check e rollback
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: false
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            WEB_PORT="${WEB_PORT:-8080}"
            HEALTH_URL="http://localhost:${WEB_PORT}/api/health"
            MAX_RETRIES=12
            RETRY_INTERVAL=5

            echo "📌 Revisão atual: $(git rev-parse --short HEAD)"
            PREV_REV="$(git rev-parse HEAD)"

            echo "⬇️  A atualizar código..."
            git fetch --all --prune
            git checkout main
            git pull --ff-only origin main

            echo "🐳 A reconstruir containers..."
            docker compose up -d --build

            echo "🗄️  A correr migrações Prisma..."
            docker compose exec -T api npx prisma migrate deploy

            echo "🏥 A verificar saúde da aplicação..."
            for i in $(seq 1 $MAX_RETRIES); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
              if [ "$STATUS" = "200" ]; then
                echo "✅ Aplicação saudável (HTTP $STATUS)"
                exit 0
              fi
              echo "⏳ Tentativa $i/$MAX_RETRIES — HTTP $STATUS — a aguardar ${RETRY_INTERVAL}s..."
              sleep $RETRY_INTERVAL
            done

            echo "❌ Health check falhou após $((MAX_RETRIES * RETRY_INTERVAL))s. A fazer rollback para $PREV_REV..."
            git checkout "$PREV_REV"
            docker compose up -d --build
            docker compose exec -T api npx prisma migrate deploy

            echo "🔁 Rollback concluído. Aplicação restaurada para revisão $(git rev-parse --short HEAD)."
            exit 1
